        <div class="Contacto">
            <h2>Contacto</h2>
            <p>Si quieres más información sobre entradas, horarios o artistas, rellena el siguiente formulario.</p>
        </div>

        <main class="Formulario">
            <form action="#" method="post">

                <label for="Nombre">Nombre</label>
                <input type="text" id="Nombre" name="nombre" placeholder="Nombre completo">

                <label for="Email">Correo electrónico</label>
                <input type="email" name="email" id="email" placeholder="correo@gmail.com">

                <label for="Asunto">Asunto</label>
                <select name="Asunto" id="Asunto">
                    <option value="informacion">Más información</option>
                    <option value="entrada">Entradas</option>
                    <option value="artista">Artista</option>
                </select>

                <label for="Mensaje">Mensaje</label>
                <textarea name="Mensaje" id="Mensaje" placeholder="Escribe tu mensaje aquí"></textarea>

                <button type="submit">Enviar</button>
            </form>
        </main>
